name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install CMake and Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++

    - name: Clean stale CMake cache
      run: rm -rf NEXORA/build

    - name: Configure
      run: cmake -S NEXORA -B NEXORA/build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build NEXORA/build --parallel
